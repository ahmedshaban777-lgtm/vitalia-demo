<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fdf9f5;font-family:'Cairo',sans-serif}
.row{display:flex;gap:20px;padding:20px;width:max-content}
.card{width:250px;height:350px;background:#fff;border:1px solid #f0e4e2;border-radius:22px;box-shadow:0 14px 34px rgba(122,46,84,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative}
.card .num{position:absolute;top:12px;inset-inline-start:12px;background:#fdf0f4;color:#e0457b;font-weight:900;font-size:.9rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.card .logo{width:170px;height:170px;display:grid;place-items:center}
.card svg{width:100%;height:100%}
.card .w svg{width:100%;height:auto}
</style>
</head>
<body>
<div class="row">

<div class="card"><span class="num">١</span><div class="logo">
<svg viewBox="0 0 48 48"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0457b"/><stop offset="1" stop-color="#f0b95c"/></linearGradient></defs><rect x="2" y="2" width="44" height="44" rx="13" fill="url(#ga)"/><path d="M14 15 L24 35 L33 16" stroke="#fff" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M33.5 14.5 C36.5 13.5 38.5 10.8 39 7 C35.8 7.6 33.8 10 33.5 14.5 Z" fill="#fff"/></svg>
</div></div>

<div class="card"><span class="num">٢</span><div class="logo w">
<svg viewBox="0 0 320 130"><defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0457b"/><stop offset="1" stop-color="#d99a3a"/></linearGradient></defs><text x="160" y="86" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="66" fill="url(#gb)">Vitalia</text><path d="M243 40 C250 38 254 32 255 24 C249 26 244 31 243 40 Z" fill="url(#gb)"/></svg>
</div></div>

<div class="card"><span class="num">٣</span><div class="logo">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#2a1830"/><circle cx="50" cy="50" r="46" fill="none" stroke="#d99a3a" stroke-width="2.5"/><circle cx="50" cy="50" r="38" fill="none" stroke="#d99a3a" stroke-width="1" opacity=".6"/><text x="50" y="68" text-anchor="middle" font-family="Playfair Display" font-weight="700" font-size="44" fill="#f0b95c">V</text><path d="M67 33 C71 32 73.5 29 74 24.5 C70.5 25.5 68 28.5 67 33 Z" fill="#f0b95c"/></svg>
</div></div>

<div class="card"><span class="num">٤</span><div class="logo">
<svg viewBox="0 0 96 96"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0457b"/><stop offset="1" stop-color="#f0b95c"/></linearGradient></defs><path d="M20 14 Q31 52 48 80" stroke="url(#gd)" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M76 14 Q65 52 48 80" stroke="url(#gd)" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M68 22 C76 20 81 14 82 6 C75 8 70 14 68 22 Z" fill="url(#gd)"/><path d="M28 22 C20 20 15 14 14 6 C21 8 26 14 28 22 Z" fill="url(#gd)"/></svg>
</div></div>

<div class="card"><span class="num">٥</span><div class="logo">
<svg viewBox="0 0 96 96"><defs><linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0457b"/><stop offset="1" stop-color="#f0b95c"/></linearGradient></defs><g fill="url(#ge)"><path d="M48 12 C55 26 55 42 48 56 C41 42 41 26 48 12 Z"/><path d="M48 12 C55 26 55 42 48 56 C41 42 41 26 48 12 Z" transform="rotate(-38 48 56)"/><path d="M48 12 C55 26 55 42 48 56 C41 42 41 26 48 12 Z" transform="rotate(38 48 56)"/></g><path d="M30 76 Q48 88 66 76" stroke="#d99a3a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
</div></div>

</div>
</body>
</html>
